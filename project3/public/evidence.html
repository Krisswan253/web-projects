        <script>
        (function(){
            const numberEl = document.getElementById('smsNumber');
            const bodyEl   = document.getElementById('smsBody');
            const linkEl   = document.getElementById('smsLink');

            function updateLink(){
            const rawNum = (numberEl.value || '').replace(/[^+\d]/g,'');
            const body   = encodeURIComponent(bodyEl.value);
            if(!rawNum){linkEl.href="#";return;}
            const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
            linkEl.href = ios
                ? `sms:${rawNum}&body=${body}`
                : `sms:${rawNum}?body=${body}`;
            }
            numberEl.addEventListener('input', updateLink);
            updateLink();
        })();
        </script>

        <script src="/script.js"></script>
    </body>
